name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # The install path a stranger takes, on a machine that has never seen the source.
  # It is a separate job because a checkout on disk hides a packaging mistake: the
  # asset resolver falls back to the source tree and everything looks fine.
  #
  # It runs on macOS as well as Linux because that is where the two install paths
  # people actually use are — pipx and brew — and because the config directory
  # differs there (`~/Library/Application Support`, `src/edify/paths.py`).
  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build==1.6.1 pytest && python -m build
      # The artefact assertions are private tests and are not in the public export,
      # so the step runs only where the file is.
      - name: the artefact assertions, on the wheel just built
        if: hashFiles('tests/assertions/test_m1_artefacts.py') != ''
        run: EDIFY_DIST=dist pytest tests/assertions/test_m1_artefacts.py -q
      - name: install the wheel somewhere with no checkout in sight
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere" && cd "$RUNNER_TEMP/elsewhere"
          python -m venv .venv
          .venv/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          mkdir -p demo/src && cd demo
          printf '[project]\nname = "demo"\ndependencies = ["fastapi"]\n' > pyproject.toml
          printf 'def health():\n    return {"ok": True}\n' > src/app.py
          ../.venv/bin/edify init --yes
          ../.venv/bin/edify doctor
          ../.venv/bin/edify graph where health
          ../.venv/bin/edify check --exit-code
          ../.venv/bin/edify governance verify --exit-code

      - name: a non-interactive run writes nothing outside the repository
        run: |
          cd "$RUNNER_TEMP/elsewhere/demo"
          ../.venv/bin/edify --quiet graph stat
          test ! -e "$HOME/Library/Application Support/edify/state"
          test ! -e "$HOME/.config/edify/state"

  # `pipx` is what INSTALL.md tells people to run, so it is what CI runs: on every OS
  # the package supports, at both ends of the Python range.
  pipx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install build==1.6.1 pipx==1.17.6 && python -m build --wheel
      - run: pipx install --python "$(python -c 'import sys;print(sys.executable)')" ./dist/edify_agents_cli-*.whl
      - name: install, init, and verify in a fresh repository
        run: |
          mkdir -p "$RUNNER_TEMP/demo/src" && cd "$RUNNER_TEMP/demo"
          printf '[project]\nname = "demo"\n' > pyproject.toml
          printf 'def health():\n    return 1\n' > src/app.py
          test "$(edify --version)" = "edify $(python -c "import os,re;print(re.search(r'__version__ = \"(.+)\"', open(os.path.join(os.environ['GITHUB_WORKSPACE'], 'src', 'edify', '__init__.py')).read()).group(1))")"
          edify init --yes
          edify doctor
          edify check --exit-code
          edify governance verify --exit-code

  # EDIFY checks its own repository with its own binary. If the harness cannot pass
  # what it asks of a customer's tree, it is ceremony and should be deleted rather
  # than defended.
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: edify init --force --yes
      - run: edify doctor
      - run: edify check --exit-code
      - run: edify governance verify --exit-code
