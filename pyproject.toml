[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "edify-agents-cli"
dynamic = ["version"]
description = "A harness that makes an AI coding agent work reliably on large codebases: three documents and a map."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "EDIFY" }]
keywords = ["ai", "codegen", "codebase", "graph", "spec", "agent", "harness"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]

# Deliberately empty. The CLI runs on the standard library alone so it installs
# on a locked-down build server without a procurement conversation.
dependencies = []

[project.optional-dependencies]
# Optional, never required. Enables syntax-tree extraction for the languages the
# built-in scanner covers by pattern instead. `edify doctor` reports which is in use.
treesitter = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/EDIFY-agents/EDIFY"
Documentation = "https://github.com/EDIFY-agents/EDIFY#readme"
Changelog = "https://github.com/EDIFY-agents/EDIFY/blob/main/CHANGELOG.md"
Issues = "https://github.com/EDIFY-agents/EDIFY/issues"

[project.scripts]
edify = "edify.cli:main"

[tool.hatch.version]
path = "src/edify/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/edify"]

# The authored methodology tree lives at the repository root, where the installed
# layout is built from. It ships inside the
# package as `edify/assets/` so `edify init` can install it with no network.
[tool.hatch.build.targets.wheel.force-include]
"edify/manifest.md" = "edify/assets/manifest.md"
"edify/commands" = "edify/assets/commands"
"edify/formats" = "edify/assets/formats"
"edify/skills" = "edify/assets/skills"
"edify/mcp" = "edify/assets/mcp"
"edify/harvest" = "edify/assets/harvest"
"edify/templates" = "edify/assets/templates"

[tool.hatch.build.targets.sdist]
# Anchored with a leading `/`: an unanchored `README.md` matches at every depth and
# would carry README files from private folders into the public sdist.
include = [
  "/src/edify",
  "/edify",
  "/tests",
  "/README.md",
  "/INSTALL.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
exclude = ["/tests/assertions", "/tests/private"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
